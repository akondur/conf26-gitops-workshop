name: Health Check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call Splunk Cloud server/info endpoint
        env:
          STACK_NAME: ${{ secrets.STACK_NAME }}
          SPLUNK_USER: ${{ secrets.SPLUNK_USER }}
          SPLUNK_PASSWORD: ${{ secrets.SPLUNK_PASSWORD }}
        run: |
          curl -sfk \
            -u "${SPLUNK_USER}:${SPLUNK_PASSWORD}" \
            "https://${STACK_NAME}:8089/services/server/info?output_mode=json" \
            -o server_info.json
          cat server_info.json

      - name: Print Splunk version
        run: |
          python3 -c "
          import json
          info = json.load(open('server_info.json'))
          print('Splunk version:', info['entry'][0]['content']['version'])
          "
